services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: hizmat, POSTGRES_PASSWORD: hizmat, POSTGRES_DB: hizmat }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    depends_on: [db, redis]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://hizmat:hizmat@db:5432/hizmat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_PHONES: ${ADMIN_PHONES:-+992900000001}
volumes:
  pgdata:
