# Сохтани APK-и Android дар серверҳои EAS (Expo).
# Талабот (як маротиба):
#   1) Лоиҳа: expo.dev/accounts/asrorsodikov/projects/tezrason (ID дар app.config.js).
#   2) expo.dev → Account settings → Access tokens → Create → GitHub → Settings → Secrets → Actions → EXPO_TOKEN.
#   3) (ихтиёрӣ) expo.dev → Project → Environment variables → GOOGLE_MAPS_API_KEY (secret) — барои харита.
# Натиҷа: expo.dev → Project → Builds → пайванди .apk (QR-код барои насб).
name: Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'docs/**', '**/*.md']

concurrency:
  group: eas-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN нест. GitHub → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: сохтан дар EAS идома меёбад; натиҷа дар expo.dev → Builds
      - name: Build APK (preview profile)
        run: eas build --platform android --profile preview --non-interactive --no-wait
